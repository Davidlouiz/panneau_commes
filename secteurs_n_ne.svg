<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="85 85 510 510">

<!-- Secteurs en anneau autour du centre exact (340,340), rayon ext. 250, rayon int. 55 -->
